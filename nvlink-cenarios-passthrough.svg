<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="1520" height="680" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1a1a1a">O que o nvidia-smi topo -m decide no passthrough</text>
  <text x="24" y="50" font-size="11.5" fill="#5c5c5c">Regra da NVIDIA: GPUs ligadas diretamente por NVLink precisam ser atribuídas à mesma VM.</text>

  <rect x="24" y="66" width="230" height="256" rx="10" fill="#f7f7f5" stroke="#b5b8ad" stroke-width="1.25"/>
  <text x="139" y="90" text-anchor="middle" font-weight="600" fill="#1a1a1a">Sem bridge NVLink</text>
  <text x="139" y="108" text-anchor="middle" font-size="11.5" fill="#5c5c5c">topo: só PIX, PXB, NODE ou SYS</text>
  <g font-size="11.5" font-weight="600" text-anchor="middle">
    <rect x="41" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="61" y="158" fill="#1a1a1a">0</text>
    <rect x="93" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="113" y="158" fill="#1a1a1a">1</text>
    <rect x="145" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="165" y="158" fill="#1a1a1a">2</text>
    <rect x="197" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="217" y="158" fill="#1a1a1a">3</text>
  </g>
  <text x="139" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#3B6D11">Separe as GPUs como quiser</text>
  <text x="139" y="228" text-anchor="middle" font-size="11.5" fill="#5c5c5c">Qualquer GPU serve para o</text>
  <text x="139" y="246" text-anchor="middle" font-size="11.5" fill="#5c5c5c">FindFace. O TEP2 do Flash-Next</text>
  <text x="139" y="264" text-anchor="middle" font-size="11.5" fill="#5c5c5c">conversa só por PCIe</text>
  <text x="139" y="282" text-anchor="middle" font-size="11.5" fill="#5c5c5c">(mais lento).</text>

  <rect x="265" y="66" width="230" height="256" rx="10" fill="#f7f7f5" stroke="#b5b8ad" stroke-width="1.25"/>
  <text x="380" y="90" text-anchor="middle" font-weight="600" fill="#1a1a1a">Bridges de 2 vias (pares)</text>
  <text x="380" y="108" text-anchor="middle" font-size="11.5" fill="#5c5c5c">topo: NV# só dentro de cada par</text>
  <g fill="none" stroke="#534AB7" stroke-width="3">
    <path d="M302 138V126H354V138"/>
    <path d="M406 138V126H458V138"/>
  </g>
  <g font-size="11.5" font-weight="600" text-anchor="middle">
    <rect x="282" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="302" y="158" fill="#1a1a1a">0</text>
    <rect x="334" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="354" y="158" fill="#1a1a1a">1</text>
    <rect x="386" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="406" y="158" fill="#1a1a1a">2</text>
    <rect x="438" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="458" y="158" fill="#1a1a1a">3</text>
  </g>
  <text x="380" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#854F0B">Cada par vai inteiro para uma VM</text>
  <text x="380" y="228" text-anchor="middle" font-size="11.5" fill="#5c5c5c">O FindFace não pode ficar com</text>
  <text x="380" y="246" text-anchor="middle" font-size="11.5" fill="#5c5c5c">só uma GPU de um par. Tire o</text>
  <text x="380" y="264" text-anchor="middle" font-size="11.5" fill="#5c5c5c">bridge do par dele; o outro par</text>
  <text x="380" y="282" text-anchor="middle" font-size="11.5" fill="#5c5c5c">fica com o TEP2 na VM RHEL.</text>

  <rect x="506" y="66" width="230" height="256" rx="10" fill="#f7f7f5" stroke="#b5b8ad" stroke-width="1.25"/>
  <text x="621" y="90" text-anchor="middle" font-weight="600" fill="#1a1a1a">Bridge de 4 vias</text>
  <text x="621" y="108" text-anchor="middle" font-size="11.5" fill="#5c5c5c">topo: NV# entre todas as GPUs</text>
  <g fill="none" stroke="#534AB7" stroke-width="3">
    <path d="M543 138V126H699V138"/>
    <path d="M595 126V138"/>
    <path d="M647 126V138"/>
  </g>
  <g font-size="11.5" font-weight="600" text-anchor="middle">
    <rect x="523" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="543" y="158" fill="#1a1a1a">0</text>
    <rect x="575" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="595" y="158" fill="#1a1a1a">1</text>
    <rect x="627" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="647" y="158" fill="#1a1a1a">2</text>
    <rect x="679" y="138" width="40" height="32" rx="4" fill="#ffffff" stroke="#8a8d84"/><text x="699" y="158" fill="#1a1a1a">3</text>
  </g>
  <text x="621" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#A32D2D">As 4 GPUs vão para a mesma VM</text>
  <text x="621" y="228" text-anchor="middle" font-size="11.5" fill="#5c5c5c">Separar em duas VMs foge da</text>
  <text x="621" y="246" text-anchor="middle" font-size="11.5" fill="#5c5c5c">configuração suportada. Troque</text>
  <text x="621" y="264" text-anchor="middle" font-size="11.5" fill="#5c5c5c">por um bridge de 2 vias no par</text>
  <text x="621" y="282" text-anchor="middle" font-size="11.5" fill="#5c5c5c">do TEP2 ou retire o bridge.</text>
</svg>
