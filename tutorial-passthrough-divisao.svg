  <rect x="565" y="104" width="155" height="134" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.25"/>
  <text x="642" y="146" text-anchor="middle" font-weight="600" fill="#3C3489">GPU 3</text>
  <text x="642" y="170" text-anchor="middle" font-size="11.5" fill="#534AB7">passthrough</text>
  <text x="642" y="190" text-anchor="middle" font-size="11.5" fill="#534AB7">141 GB inteira</text>

