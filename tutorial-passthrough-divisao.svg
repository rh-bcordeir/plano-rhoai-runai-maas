  <text x="40" y="90" font-size="11.5" fill="#5c5c5c">4× H200 NVL · label nvidia.com/gpu.workload.config=vm-passthrough · sem NVIDIA AI Enterprise</text>

  <rect x="40" y="104" width="155" height="134" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.25"/>
  <text x="117" y="146" text-anchor="middle" font-weight="600" fill="#085041">GPU 0</text>
  <text x="117" y="170" text-anchor="middle" font-size="11.5" fill="#0F6E56">passthrough</text>
  <text x="117" y="190" text-anchor="middle" font-size="11.5" fill="#0F6E56">141 GB inteira</text>

