  <rect x="24" y="302" width="236" height="104" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.25"/>
  <text x="142" y="328" text-anchor="middle" font-weight="600" fill="#085041">VM Ubuntu · FindFace</text>
  <text x="142" y="350" text-anchor="middle" font-size="11.5" fill="#0F6E56">Docker Compose (NtechLab)</text>
  <text x="142" y="370" text-anchor="middle" font-size="11.5" fill="#0F6E56">1 H200 inteira (141 GB)</text>
  <text x="142" y="390" text-anchor="middle" font-size="11.5" fill="#0F6E56">driver datacenter, sem licença</text>

