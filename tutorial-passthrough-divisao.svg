  <text x="506" y="390" text-anchor="middle" font-size="11.5" fill="#534AB7">Flash-Next TEP2 no par NVLink · LLM menor e embeddings na terceira</text>

  <text x="24" y="434" font-size="11.5" fill="#5c5c5c">Verde = VM Ubuntu (FindFace) · roxo = VM RHEL (LLMs). No passthrough, GPUs ligadas entre si por NVLink</text>
  <text x="24" y="452" font-size="11.5" fill="#5c5c5c">precisam ir para a mesma VM: confira com nvidia-smi topo -m antes de criar as VMs definitivas.</text>
