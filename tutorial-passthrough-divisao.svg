  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1a1a1a">Tutorial 2: GPUs inteiras por PCI passthrough (sem licença)</text>

  <rect x="24" y="48" width="712" height="204" rx="12" fill="#f7f7f5" stroke="#b5b8ad" stroke-width="1.25"/>
